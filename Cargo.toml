[package]
name = "risula"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14"
prost-types = "0.14"
chrono = "0.4.35"
serde_json = "1"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
