// RPC fields from iSulad v2.1.5 container.proto.
syntax = "proto3";
package containers;

service ContainerService {
    rpc Create(CreateRequest) returns (CreateResponse);
    rpc Version(VersionRequest) returns (VersionResponse);
    rpc Info(InfoRequest) returns (InfoResponse);
    rpc Stop(StopRequest) returns (StopResponse);
    rpc Restart(RestartRequest) returns (RestartResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc Kill(KillRequest) returns (KillResponse);
    rpc Pause(PauseRequest) returns (PauseResponse);
    rpc Resume(ResumeRequest) returns (ResumeResponse);
    rpc Rename(RenameRequest) returns (RenameResponse);
    rpc Start(StartRequest) returns (StartResponse);
    rpc RemoteStart(stream RemoteStartRequest) returns (stream RemoteStartResponse);
    rpc Inspect(InspectContainerRequest) returns (InspectContainerResponse);
    rpc Wait(WaitRequest) returns (WaitResponse);
}

message CreateRequest {
    string id = 1;
    string rootfs = 2;
    string image = 3;
    string runtime = 4;
    string hostconfig = 5;
    string customconfig = 6;
}

message CreateResponse {
    string id = 1;
    int32 pid = 2;
    uint32 cc = 3;
    string errmsg = 4;
}

message VersionRequest {}

message VersionResponse {
    string version = 1;
    string git_commit = 2;
    string build_time = 3;
    string root_path = 4;
    uint32 cc = 5;
    string errmsg = 6;
}

message InfoRequest {}

message InfoResponse {
    uint32 cc = 1;
    string errmsg = 2;
    string version = 3;
    uint32 containers_num = 4;
    uint32 c_running = 5;
    uint32 c_paused = 6;
    uint32 c_stopped = 7;
    uint32 images_num = 8;
    string kversion = 9;
    string os_type = 10;
    string architecture = 11;
    string nodename = 12;
    uint32 cpus = 13;
    string operating_system = 14;
    string cgroup_driver = 15;
    string logging_driver = 16;
    string huge_page_size = 17;
    string isulad_root_dir = 18;
    uint32 total_mem = 19;
    string http_proxy = 20;
    string https_proxy = 21;
    string no_proxy = 22;
    string driver_name = 23;
    string driver_status = 24;
}

message StopRequest {
    string id = 1;
    bool force = 2;
    int32 timeout = 3;
}

message StopResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message RestartRequest {
    string id = 1;
    int32 timeout = 2;
}

message RestartResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message DeleteRequest {
    string id = 1;
    bool force = 2;
    bool volumes = 3;
}

message DeleteResponse {
    string id = 1;
    uint32 exit_status = 2;
    uint32 cc = 3;
    string errmsg = 4;
}

message KillRequest {
    string id = 1;
    uint32 signal = 2;
}

message KillResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message PauseRequest {
    string id = 1;
}

message PauseResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message ResumeRequest {
    string id = 1;
}

message ResumeResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message RenameRequest {
    string oldname = 1;
    string newname = 2;
}

message RenameResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message StartRequest {
    string id = 1;
    string stdin = 2;
    bool attach_stdin = 3;
    string stdout = 4;
    bool attach_stdout = 5;
    string stderr = 6;
    bool attach_stderr = 7;
}

message StartResponse {
    string id = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message RemoteStartRequest {
    bytes stdin = 1;
    bool finish = 2;
}

message RemoteStartResponse {
    bytes stdout = 1;
    bytes stderr = 2;
    bool finish = 3;
}

message InspectContainerRequest {
    string id = 1;
    bool bformat = 2;
    int32 timeout = 3;
}

message InspectContainerResponse {
    string ContainerJSON = 1;
    uint32 cc = 2;
    string errmsg = 3;
}

message WaitRequest {
    string id = 1;
    uint32 condition = 2;
}

message WaitResponse {
    uint32 cc = 1;
    uint32 exit_code = 2;
    string errmsg = 3;
}
