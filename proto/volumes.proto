// RPC fields from iSulad v2.1.5 volumes.proto.
syntax = "proto3";
package volume;

service VolumeService {
    rpc List(ListVolumeRequest) returns (ListVolumeResponse);
}
message Volume {
    string driver = 1;
    string name = 2;
}
message ListVolumeRequest {}
message ListVolumeResponse {
    repeated Volume volumes = 1;
    uint32 cc = 2;
    string errmsg = 3;
}
